<!DOCTYPE html>
  <head>
		<title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
		  rel="stylesheet" >
    <link rel="stylesheet"
		  href="style.css"
			media="screen"
			charset="utf-8">
  </head>
  <body class="body">
    <div class="info">
      <img class="info__image" 
        src="./eisenhower-matrix.jpg">
      <a class="info__link"
			  href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </div>
    <div class="main-wrapper">
      <p id="added">
        <label class="added__task"
          for="new-task">Add Item</label>
        <div class="added__wrapper">
          <input id="new-task"
					  class="task added__input"
						type="text">
          <button class="added__button">Add</button>
        </div>
      </p>
      <h3 class="task__title">Todo</h3>
      <ul id="activ">
        <li class="task__item activ__item">
          <input class="checkbox__input"
            type="checkbox">
          <label class="task task__label">Pay Bills</label>
          <input class="task text__input"
					  type="text">
          <button class="edit edit__button">Edit</button>
          <button class="delete delete__button">
            <img class="delete__img" 
              src="./remove.svg">
          </button>
        </li>
        <li class="task__item activ__item edit__item">
          <input class="checkbox__input"
            type="checkbox">
          <label class="task task__label">Go Shopping</label>
          <input class="task text__input "
					  type="text"
						value="Go Shopping">
          <button class="edit edit__button">Save</button>
          <button class="delete delete__button">
            <img class="delete__img" 
              src="./remove.svg">
          </button>
        </li>
      </ul>
      <h3 class="task__title">Completed</h3>
      <ul id="completed-tasks">
        <li class="task__item completed__item">
          <input class="checkbox__input"
            type="checkbox"
            checked>
          <label class="task task__label ">See the Doctor</label>
          <input class="task text__input"
					  type="text">
          <button class="edit edit__button">Edit</button>
          <button class="delete delete__button">
            <img class="delete__img" 
              src="./remove.svg">
          </button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
