<!DOCTYPE html>
  <head>
		<title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
		  rel="stylesheet" >
    <link rel="stylesheet"
		  href="style.css"
			media="screen"
			charset="utf-8">
  </head>
  <body class="body">
    <header class="info">
      <h1 class="visually-hidden">Todo App</h1>
      <figure class="info__figure">
        <img class="info__img" 
          src="./eisenhower-matrix.jpg"
          alt="eisenhower-matrix">
        <figcaption class="info__figcaption">
          <a class="info__link"
			    href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?
          </a>
        </figcaption>
      </figure>
    </header>
    <main>
      <div class="main-wrapper">
        <h2 class="visually-hidden">Eisenhower matrix tasks</h2>
        <section id="added">
          <h3 class="added__title subtitle">Add Item</h3>
          <div class="added__wrapper">
              <input id="new-task"
			        class="task added__input"
				      type="text">
            <button class="added__button">Add</button>
          </div>
        </section>
        <section class="activ">  
          <h3 class="activ__title subtitle">Todo</h3>
          <ul id="activ"
            class="activ__list">
            <li class="task-item activ__item">
              <input class="checkbox__input task-item__input"
                type="checkbox">
              <label class="task task__label task-item__label">Pay Bills</label>
              <input class="task text__input task-item__input"
					      type="text">
              <button class="edit edit__button task-item__button">Edit</button>
              <button class="delete delete__button task-item__button">
                <img class="delete__img task-item__img" 
                  src="./remove.svg"
                  alt="delete">
              </button>
            </li>
            <li class="task-item activ__item edit-item">
              <input class="checkbox__input task-item__input"
                type="checkbox">
              <label class="task task__label task-item__label">Go Shopping</label>
              <input class="task text__input task-item__input"
					      type="text"
						    value="Go Shopping">
              <button class="edit edit__button task-item__button">Save</button>
              <button class="delete delete__button task-item__button">
                <img class="delete__img task-item__img" 
                  src="./remove.svg"
                  alt="delete">
              </button>
            </li>
          </ul>
        </section>
        <section class="completed">
          <h3 class="completed__title subtitle">Completed</h3>
          <ul id="completed-tasks"
            class="completed__list">
            <li class="task-item completed__item">
              <input class="checkbox__input task-item__input"
                type="checkbox"
                checked>
              <label class="task task__label task-item__label">See the Doctor</label>
              <input class="task text__input task-item__input"
					      type="text">
              <button class="edit edit__button task-item__button">Edit</button>
              <button class="delete delete__button task-item__button">
                <img class="delete__img task-item__img" 
                  src="./remove.svg"
                  alt="delete">
              </button>
            </li>
          </ul>
        </section>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
