<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link 
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700" >
    <link
      rel="stylesheet" 
      href="style.css"
      media="screen" 
      charset="utf-8">
  </head>
  <body>
    <div class="info">
      <img src="./eisenhower-matrix.jpg">
      <a
        class="more_inf" 
        href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </div>
    <div class="main__wrapper">
      <p id="added__task">
      <label
        for="new-task">Add Item</label>
      <div class="added__wrapper">
      <input
        id="new-task"
        class="task"
        type="text">
      <button>Add</button>
      </div>
      </p>
      <h3>Todo</h3>
      <ul 
        id="incomplete__tasks">
        <li>
          <input
            type="checkbox">
          <label class="task">Pay Bills</label>
          <input 
            class="task"
            type="text" >
          <button class="edit">Edit</button>
          <button class="delete">
            <img src="./remove.svg">
          </button>
        </li>
        <li class="editMode">
          <input
            type="checkbox">
          <label class="task">Go Shopping</label>
          <input
            class="task" 
            type="text" 
            value="Go Shopping">
          <button class="edit">Save</button>
          <button class="delete">
            <img 
              src="./remove.svg">
          </button>
        </li>
      </ul>
      <h3>Completed</h3>
      <ul
        id="completed-tasks">
        <li>
          <input
            type="checkbox"
            checked>
          <label class="task">See the Doctor</label>
          <input
            class="task"
            type="text">
           <button class="edit">Edit</button>
           <button
            class="delete">
            <img src="./remove.svg">
           </button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
